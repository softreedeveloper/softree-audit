[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "softree-audit"
version = "0.1.0"
description = "Softree Audit — auditoría interna de seguridad, SEO y rendimiento web"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "redis>=5.2",
  "httpx>=0.28",
  "arq>=0.26",
  "selectolax>=0.3.21",
  "defusedxml>=0.7.1",
  "cryptography>=43.0",
  "structlog>=24.4",
  "typer>=0.15",
  "uuid6>=2024.7.10",
  "jinja2>=3.1",
  "weasyprint>=63",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "types-redis>=4.6",
  "types-defusedxml>=0.7",
]

[project.scripts]
softree-audit = "softree_audit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["softree_audit"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["softree_audit"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # bugbear
  "S",         # bandit
  "C4",        # comprehensions
  "DTZ",       # datetimez
  "T20",       # print
  "SIM",       # simplify
  "TID",       # tidy imports
  "RUF",
]
ignore = [
  "S101",   # assert: permitido en pruebas
  "B008",   # Depends() en valores por defecto es el idioma de FastAPI
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["uuid6.*", "selectolax.*", "arq.*", "weasyprint.*"]
ignore_missing_imports = true
