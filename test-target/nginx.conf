server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Sin cabeceras de seguridad a propósito: el passive scan de ZAP debe
    # reportar su ausencia.
    server_tokens on;

    # Cadena de redirección deliberada para la regla SEO-015.
    location = /redirect-1 { return 302 /redirect-2; }
    location = /redirect-2 { return 302 /final.html; }

    location / {
        try_files $uri $uri/ =404;
    }
}
