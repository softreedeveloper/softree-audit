<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Formulario de prueba</title>
    <meta name="description" content="Formulario sin protección CSRF, para el passive scan." />
    <link rel="canonical" href="https://example.org/formulario" />
  </head>
  <body>
    <h1>Formulario de prueba</h1>
    <form action="/enviar" method="post">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" type="text" />
      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" autocomplete="on" />
      <button type="submit">Enviar</button>
    </form>
    <a href="/">Inicio</a>
  </body>
</html>
