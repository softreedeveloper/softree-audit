# Frontend estático y proxy de la API bajo un mismo origen.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Si nginx redirige, que lo haga con una ruta relativa: detrás de un proxy
    # inverso, una redirección absoluta filtraría el host y el puerto internos.
    absolute_redirect off;

    # Astro genera una página por ruta, como /dashboard/index.html. Se sirve el
    # archivo directamente en lugar de redirigir a la carpeta: una redirección
    # por navegación es un viaje de ida y vuelta que no aporta nada.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # La página de error se sirve con su código real: devolver 200 en una ruta
    # inexistente engaña a los buscadores y a cualquier cliente de la API.
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Los assets con hash en el nombre pueden cachearse indefinidamente; el
    # HTML no, o un despliegue nuevo no llegaría al navegador.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # El nombre se resuelve en cada petición con el DNS interno de Docker.
        # Con un `upstream` estático, nginx resuelve al arrancar y no arranca
        # si la API todavía no existe: un reinicio del backend tumbaría también
        # el frontend.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generar un reporte con análisis de IA puede tardar minutos.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Cabeceras que la propia plataforma audita en otros sitios.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 4m;
}
